name: Update README banner

on:
  schedule:
    - cron: "7/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-banner
  cancel-in-progress: true

env:
  BANNER_LOCALE: en-US

jobs:
  update-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Sync default branch
        run: |
          git fetch origin
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
      - run: node scripts/update-banner.mjs
      - name: Publish updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner.svg
          if git diff --cached --quiet; then
            echo "Banner state is already current"
            exit 0
          fi
          git commit -m "chore: update banner"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
