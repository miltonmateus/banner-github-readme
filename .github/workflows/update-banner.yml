name: Update README banner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-banner
  cancel-in-progress: true

env:
  BANNER_LOCALE: en-US

jobs:
  update-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-banner.mjs
      - name: Publish updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git add banner.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update banner"
          fi
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"